authors = ["AI Architect <ai@example.com>"]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
reflex = "==0.9.1"
spacy = "==3.7.4"
sentence-transformers = "==2.7.0"
umap-learn = "==0.5.6"
hdbscan = "==0.8.33"
rank-bm25 = "==0.2.2"
