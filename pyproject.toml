[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillmap"
version = "1.0.0"
description = "Explainable resume skill mapping and job matching"
readme = "README.md"
requires-python = ">=3.11,<3.13"

[tool.setuptools.packages.find]
include = ["skillmap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --strict-config"
markers = ["evaluation: deterministic scoring quality checks"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", ".web", "models"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"skillmap/pages/*.py" = ["E501"]
"skillmap/styles/*.py" = ["E501"]
"skillmap/state/*.py" = ["RUF012"]
"skillmap/ml/ats_scorer.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = "^skillmap/(pages|components|styles)/"

[[tool.mypy.overrides]]
module = [
    "rank_bm25",
    "joblib",
    "sklearn.*",
    "pdfminer.*",
    "docx.*",
    "sentence_transformers.*",
    "umap.*",
    "hdbscan.*",
    "torch",
    "torch.*",
    "transformers",
    "transformers.*",
    "onnxruntime",
    "onnxruntime.*",
    "skl2onnx",
    "skl2onnx.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["skillmap.pages.*", "skillmap.components.*", "skillmap.styles.*"]
ignore_errors = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B403", "B301"]
